name: Render Derinkuyu Short
on:
  workflow_dispatch:  # Manual trigger from Actions tab
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    name: Render 2K Vertical Video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Remotion bundle
        run: npm run build

      - name: Render video (2K vertical, h264 CRF 16)
        run: |
          npx remotion render src/index.tsx DerinkuyuShort out/final.mp4 \
            --codec h264 \
            --crf 16 \
            --gl=angle \
            --concurrency 4

      - name: Verify output
        run: |
          ls -lh out/final.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration -of csv=p=0 out/final.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: derinkuyu-video
          path: out/final.mp4
          retention-days: 7
          compression-level: 0

  mux-audio:
    name: Mux with Audio
    runs-on: ubuntu-latest
    needs: render
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download video artifact
        uses: actions/download-artifact@v4
        with:
          name: derinkuyu-video
          path: out/

      - name: Generate audio mix
        run: |
          cd audio
          python3 -m pip install --quiet scipy numpy
          python3 timeline.py
          python3 sfx_gen.py
          python3 music.py
          python3 mix.py

      - name: Mux video + audio
        run: |
          ffmpeg -y -i out/final.mp4 -i out/derinkuyu/mix.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k \
            -shortest out/final_muxed.mp4

      - name: Verify final output
        run: |
          ls -lh out/final_muxed.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,sample_rate,channels -of csv=p=0 out/final_muxed.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: derinkuyu-final
          path: out/final_muxed.mp4
          retention-days: 30
          compression-level: 0